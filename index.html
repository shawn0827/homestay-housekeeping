<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#55755f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="民宿營運">
  <title>民宿營運管理系統</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="pullRefresh" class="pull-refresh" aria-live="polite">下拉重新整理</div>
  <header class="app-header">
    <button id="homeBrand" class="brand-button" aria-label="回到主頁">
      <span class="brand-mark">🏡</span>
      <span><small>HOMESTAY OS</small><strong id="propertyTitle">我的民宿</strong></span>
    </button>
    <button id="accountButton" class="account-button" aria-label="使用者帳號">
      <span id="accountAvatar" class="account-avatar">👤</span>
      <span id="accountName">民宿主人</span>
    </button>
  </header>

  <main id="app" class="app-shell" tabindex="-1"></main>

  <!--
    底部導覽 icon 修改位置：
    直接更換每個 <span>...</span> 內的符號即可。
    例如將「⌂」改成「🏠」。
  -->
  <nav class="bottom-nav" aria-label="主要功能">
    <button data-route="home"><span>⌂</span>主頁</button>
    <button data-route="bookings"><img src="icons/booking.svg">訂房</button>
    <button data-route="housekeeping"><img src="icons/house-keeping.svg">房務</button>
    <button data-route="inventory"><img src="icons/box.svg">備品</button>
    <button data-route="settings"><img src="icons/setting.svg">設定</button>
  </nav>

  <dialog id="formDialog"><form id="formDialogBody" method="dialog"></form></dialog>
  <dialog id="confirmDialog"><form method="dialog" class="dialog-card"><h2 id="confirmTitle">確認</h2><p id="confirmMessage"></p><div class="dialog-actions"><button value="cancel" class="secondary-button">取消</button><button id="confirmOk" value="default" class="danger-button">確定</button></div></form></dialog>
  <div id="toast" class="toast" role="status"></div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="./js/core.js"></script>
  <script src="./js/dashboard.js"></script>
  <script src="./js/bookings.js"></script>
  <script src="./js/housekeeping.js"></script>
  <script src="./js/inventory.js"></script>
  <script src="./js/maintenance.js"></script>
  <script src="./js/finance.js"></script>
  <script src="./js/reports.js"></script>
  <script src="./js/google.js"></script>
  <script src="./js/settings.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
